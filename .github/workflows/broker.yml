name: BroKer aktualisieren

on:
  schedule:
    # Täglich 07:30 UTC = 8:30 Uhr Winterzeit / 9:30 Uhr Sommerzeit in Berlin
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      isin:
        description: "Optional: neue ISIN aufnehmen (Krypto: BTC oder ETH). Leer lassen zum reinen Aktualisieren."
        required: false
        default: ""
      entfernen:
        description: "Optional: ISIN aus der Watchlist entfernen."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: broker
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -q pandas requests

      - name: Watchlist ändern
        if: ${{ inputs.isin != '' || inputs.entfernen != '' }}
        env:
          NEU: ${{ inputs.isin }}
          WEG: ${{ inputs.entfernen }}
        run: |
          if [ -n "$NEU" ]; then python broker/broker.py hinzufuegen "$NEU"; fi
          if [ -n "$WEG" ]; then python broker/broker.py entfernen "$WEG"; fi
          git config user.name "BroKer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.json
          git commit -m "Watchlist: ${NEU:++$NEU }${WEG:+-$WEG}" || echo "Keine Änderung"
          git push

      - name: Kurse laden und Signale berechnen
        run: python broker/daten.py app/data

      - name: Kurzbericht
        run: python broker/broker.py signale >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deploy
        uses: actions/deploy-pages@v4
